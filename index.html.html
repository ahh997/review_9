<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>مراجعة الصف التاسع</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@500;700&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Layout: header with logo (left) / game title (center) / subject (right), one framed side-scrolling stage, controls row, then a modal for each question. */
:root{
  --bg:#eef6f5; --ink:#1d4455; --muted:#5d7f8b; --card:#ffffff; --line:#cfe3e6;
  --accent:#4f9fbf; --btn:#1f4f5f; --btn-ink:#ffffff; --gold:#f6c744; --gold-deep:#d9a521;
  --good:#3e9b7a; --good-bg:#dff1ea; --warn:#c8705a; --warn-bg:#f8e5df; --veil:rgba(20,50,62,.55);
  --f-display:"Readex Pro","Tajawal",system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-body:"Tajawal","Segoe UI",Tahoma,system-ui,sans-serif;
  --f-code:ui-monospace,Menlo,Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f2128; --ink:#e3f1f4; --muted:#8fb0ba; --card:#17323b; --line:#27505d;
    --accent:#6fbad8; --btn:#2c6577; --good:#6cc5a3; --good-bg:#17382f; --warn:#e59a84; --warn-bg:#3d2620; --veil:rgba(5,15,20,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f2128; --ink:#e3f1f4; --muted:#8fb0ba; --card:#17323b; --line:#27505d;
  --accent:#6fbad8; --btn:#2c6577; --good:#6cc5a3; --good-bg:#17382f; --warn:#e59a84; --warn-bg:#3d2620; --veil:rgba(5,15,20,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.6;
  padding-block:14px 28px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.app{max-width:1080px; margin:0 auto; display:flex; flex-direction:column; gap:14px}

.top{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px}
.logo-slot{justify-self:start}
.logo{width:92px; height:92px; object-fit:contain; display:block; background:#fff; border-radius:50%; padding:6px; box-shadow:0 3px 12px rgba(30,80,100,.12)}
.top h1{font-family:var(--f-display); font-weight:700; font-size:clamp(19px,3vw,28px); margin:0; text-align:center; text-wrap:balance; line-height:1.25}
.subject{justify-self:end; text-align:right; font-family:var(--f-display); font-weight:700; font-size:clamp(16px,2.4vw,22px); color:var(--accent); line-height:1.35}

.status{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
.goal{font-family:var(--f-display); font-weight:500; color:var(--accent); font-size:17px}
.pips{display:flex; gap:5px; flex-wrap:wrap; justify-content:center; flex:1 1 220px}
.pip{width:20px; height:9px; border-radius:6px; background:var(--line); transition:background .25s}
.pip.ok{background:var(--good)} .pip.retry{background:var(--gold)}
.score{font-family:var(--f-display); font-weight:700; font-size:19px; display:flex; align-items:center; gap:6px; font-variant-numeric:tabular-nums}
.score svg{width:22px; height:22px}

.stage{
  border-radius:22px; border:6px solid var(--card); overflow:hidden; background:#cfe8f3;
  box-shadow:0 10px 30px rgba(30,80,100,.14);
}
canvas{display:block; width:100%; aspect-ratio:2/1; max-width:100%}

.ctrls{display:flex; align-items:center; justify-content:space-between; gap:12px}
.ctrl-move{display:flex; gap:10px}
.btn-c{
  min-width:72px; height:64px; padding:0 18px; border:0; border-radius:18px; font:inherit; font-family:var(--f-display); font-weight:500; font-size:21px;
  background:var(--btn); color:var(--btn-ink); box-shadow:0 5px 0 rgba(0,0,0,.25); cursor:pointer; touch-action:none; user-select:none; -webkit-user-select:none;
}
.btn-c:active,.btn-c.on{transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn-jump{background:var(--gold); color:#4a3a05; box-shadow:0 5px 0 var(--gold-deep); min-width:120px}
.btn-jump:active,.btn-jump.on{box-shadow:0 2px 0 var(--gold-deep)}
.credits{display:flex; justify-content:center; gap:14px 48px; flex-wrap:wrap; padding-top:14px; border-top:1px solid var(--line); font-family:var(--f-display); font-weight:500; font-size:18px; color:var(--ink); text-align:center}
.hint{flex:1; text-align:center; color:var(--muted); font-size:15px; line-height:1.9}
.btn-c:focus-visible,.opt:focus-visible,.go:focus-visible{outline:3px solid var(--accent); outline-offset:3px}

/* modal */
.veil[hidden]{display:none}
.veil{position:fixed; inset:0; background:var(--veil); display:grid; place-items:center; z-index:20;
  padding-block:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px))}
.card{background:var(--card); border-radius:24px; width:min(620px,100%); max-height:100%; overflow:auto; padding:22px 24px 24px; box-shadow:0 20px 50px rgba(0,0,0,.3); display:flex; flex-direction:column; gap:16px}
.meta{display:flex; gap:8px; align-items:center; flex-wrap:wrap; color:var(--muted); font-size:15px}
.chip{background:var(--good-bg); color:var(--good); border-radius:20px; padding:2px 12px; font-weight:700; font-size:14px}
.chip.mc{background:var(--line); color:var(--accent)}
.qtext{font-family:var(--f-display); font-weight:500; font-size:clamp(19px,3.2vw,25px); line-height:1.7; margin:0; text-wrap:pretty}
code{font-family:var(--f-code); direction:ltr; unicode-bidi:isolate; display:inline-block; background:var(--bg); color:var(--accent); border:1px solid var(--line); border-radius:8px; padding:0 9px; font-size:.9em; line-height:1.5}
.opts{display:grid; gap:10px}
.opts.tf{grid-template-columns:1fr 1fr}
.opt{
  display:flex; align-items:center; gap:12px; text-align:right; font:inherit; font-size:19px; padding:12px 16px; min-height:56px; border-radius:16px;
  background:var(--bg); color:var(--ink); border:2px solid var(--line); cursor:pointer; transition:border-color .15s, background .15s;
}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .lt{flex:none; width:32px; height:32px; border-radius:50%; background:var(--card); border:2px solid var(--line); display:grid; place-items:center; font-weight:700; font-size:15px; color:var(--muted)}
.opts.tf .opt{justify-content:center; font-family:var(--f-display); font-weight:700; font-size:24px; min-height:68px}
.opt.ok{background:var(--good-bg); border-color:var(--good); color:var(--good)}
.opt.no{background:var(--warn-bg); border-color:var(--warn); color:var(--warn)}
.opt:disabled{cursor:default}
.fb{min-height:28px; font-weight:700; font-size:18px}
.fb.ok{color:var(--good)} .fb.no{color:var(--warn)}
.go{align-self:flex-start; border:0; border-radius:16px; padding:12px 26px; font:inherit; font-family:var(--f-display); font-weight:700; font-size:18px; background:var(--btn); color:var(--btn-ink); cursor:pointer}
.big{font-family:var(--f-display); font-weight:700; font-size:clamp(34px,8vw,56px); text-align:center; line-height:1.2; font-variant-numeric:tabular-nums}
.center{text-align:center; align-items:center}
.center .go{align-self:center}

@media (max-width:560px){
  .top{grid-template-columns:auto 1fr; grid-template-areas:"logo subject" "title title"}
  .logo-slot{grid-area:logo} .subject{grid-area:subject} .top h1{grid-area:title}
  .logo{width:66px; height:66px}
  .ctrls{flex-wrap:wrap} .hint{order:3; flex-basis:100%}
  .btn-c{height:60px; min-width:64px}
  .opts.tf{grid-template-columns:1fr 1fr}
  .card{padding:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  {t:'mc', q:'وسم يستخدم لإنشاء قائمة مرتبة:', o:['`ol`','`ul`'], a:0},
  {t:'mc', q:'وسم يستخدم لإنشاء جدول:', o:['`border`','`tr`','`table`'], a:2},
  {t:'mc', q:'وسم يستخدم لإضافة خلايا البيانات في الجدول:', o:['`td`','`th`'], a:0},
  {t:'mc', q:'وسم يستخدم لإضافة عنوان للجدول:', o:['`table`','`border`','`caption`'], a:2}
];
// ترتيب متبادل: صح وخطأ ثم اختياري ثم صح وخطأ وهكذا
(function(){
  var tf=QUESTIONS.filter(function(q){return q.t==='tf';}), mc=QUESTIONS.filter(function(q){return q.t==='mc';}), out=[];
  for (var i=0;i<Math.max(tf.length,mc.length);i++){ if(tf[i]) out.push(tf[i]); if(mc[i]) out.push(mc[i]); }
  QUESTIONS = out;
})();
var N = QUESTIONS.length;

/* ------------------------------------------------------------------ ألوان المشهد */
var C = {
  sky1:'#cfe8f3', sky2:'#f7f0dc', sun:'rgba(255,244,205,.9)', cloud:'rgba(255,255,255,.8)',
  hill1:'#c3e0d3', hill2:'#a9d1c4', tag:'rgba(31,74,92,.13)',
  ground:'#2f6b7b', groundTop:'#6fb7bf', seam:'rgba(255,255,255,.08)',
  plat:'#7fc3cc', platTop:'#a7dde0', platSide:'#4f9aa8',
  bush:'#8fcab4', bushDark:'#74b69f',
  hair:'#5a3a2a', skin:'#f3c9a5', dress:'#9fd0ea', dressHem:'#c3e4f4', blue:'#5b9bd5', shoe:'#506b8a'
};
var W = 960, H = 480, GROUND = 410;
var G = 0.62, JUMP = 13.2, SPEED = 4.3;

/* ------------------------------------------------------------------ العالم */
var FIRST = 640, SPACING = 580, worldW = FIRST + (N-1)*SPACING + 760;
var plats = [], stars = [];
for (var i=0;i<N;i++){
  var cx = FIRST + i*SPACING, k = i%3;
  if (k===0){ plats.push({x:cx-85,y:315,w:170}); stars.push({x:cx,y:262}); }
  else if (k===1){ stars.push({x:cx,y:GROUND-92}); }
  else { plats.push({x:cx-100,y:335,w:200}); stars.push({x:cx,y:282}); }
  stars[i].done = false; stars[i].i = i;
}
var TAGS = ['<html>','<head>','<title>','<body>','<h1>','<p>','<img>','<a>','<table>','<tr>','<td>','<ul>','<li>','<hr>','<br>','<caption>'];

/* ------------------------------------------------------------------ اللاعبة */
var p, cam=0, parts=[], paused=false, cur=-1, failed=false, answered=0, score=0;
var inp = {left:false,right:false,jump:false};
function reset(){
  p = {x:90,y:GROUND-72,w:40,h:72,vx:0,vy:0,on:true,face:1,anim:0,coy:0,buf:0};
  cam = 0; parts = []; answered = 0; score = 0; cur = -1;
  stars.forEach(function(s){s.done=false;});
  buildPips(); updScore();
}

/* ------------------------------------------------------------------ واجهة */
var cv = document.getElementById('game'), ctx = cv.getContext('2d'), sc = 1;
function resize(){
  var r = cv.getBoundingClientRect(), d = Math.min(window.devicePixelRatio||1,2);
  cv.width = Math.max(1,Math.round(r.width*d)); cv.height = Math.max(1,Math.round(r.height*d)); sc = cv.width/W;
}
window.addEventListener('resize',resize);

function buildPips(){
  var h=''; for (var i=0;i<N;i++) h+='<span class="pip"></span>';
  document.getElementById('pips').innerHTML = h;
}
function updScore(){ document.getElementById('score').textContent = score+' / '+N; }
function esc(s){ return s.replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }
function rich(s){ return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>'); }

var veil = document.getElementById('veil'), card = document.getElementById('card');
var LET = ['أ','ب','ج','د'];

function openQ(i){
  cur = i; failed = false; paused = true;
  var q = QUESTIONS[i], opts = q.t==='tf' ? ['صح','خطأ'] : q.o, h='';
  h += '<div class="meta"><span class="chip '+(q.t==='mc'?'mc':'')+'">'+(q.t==='tf'?'صح أم خطأ':'اختيار من متعدد')+'</span><span>سؤال '+(i+1)+' من '+N+'</span></div>';
  h += '<p class="qtext">'+rich(q.q)+'</p>';
  h += '<div class="opts '+(q.t==='tf'?'tf':'')+'">';
  opts.forEach(function(o,j){
    h += '<button class="opt" data-j="'+j+'">'+(q.t==='mc'?'<span class="lt">'+LET[j]+'</span>':'')+'<span>'+(q.t==='tf'?o:rich(o))+'</span></button>';
  });
  h += '</div><div class="fb" id="fb" aria-live="polite"></div><div id="nextSlot"></div>';
  card.innerHTML = h; veil.hidden = false;
  var first = card.querySelector('.opt'); if (first) first.focus({preventScroll:true});
}
card.addEventListener('click',function(e){
  var b = e.target.closest('.opt'); if (!b || b.disabled || cur<0) return;
  var j = +b.dataset.j, q = QUESTIONS[cur], fb = document.getElementById('fb');
  if (j===q.a){
    card.querySelectorAll('.opt').forEach(function(x){x.disabled=true;});
    b.classList.add('ok'); fb.className='fb ok'; fb.textContent = failed ? 'أحسنتِ، الإجابة صحيحة.' : 'أحسنتِ! إجابة صحيحة.';
    if (!failed) score++;
    answered++; stars[cur].done = true; updScore();
    document.querySelectorAll('.pip')[cur].classList.add(failed?'retry':'ok');
    burst(stars[cur].x, stars[cur].y);
    document.getElementById('nextSlot').innerHTML = '<button class="go" id="goBtn">'+(answered===N?'عرض النتيجة':'متابعة')+'</button>';
    var g = document.getElementById('goBtn'); g.focus(); g.addEventListener('click',closeQ);
  } else {
    failed = true; b.disabled = true; b.classList.add('no'); fb.className='fb no'; fb.textContent='حاولي مرة ثانية.';
  }
});
function closeQ(){
  veil.hidden = true; cur = -1;
  if (answered===N) showResult(); else paused = false;
}
function showResult(){
  paused = true;
  var msg = score===N ? 'ممتاز! أجبتِ عن كل الأسئلة من أول محاولة.' : score>=N*0.7 ? 'أحسنتِ، نتيجة جميلة.' : 'بداية جيدة، جربي مرة ثانية لتتحسن نتيجتك.';
  card.className = 'card center';
  card.innerHTML = '<div class="meta" style="justify-content:center">انتهت المراجعة</div><div class="big">'+score+' / '+N+'</div><p class="qtext" style="text-align:center">الإجابات الصحيحة من أول محاولة</p><div class="fb ok">'+msg+'</div><button class="go" id="again">إعادة اللعبة</button>';
  veil.hidden = false; document.getElementById('again').focus();
  document.getElementById('again').addEventListener('click',function(){ card.className='card'; veil.hidden=true; reset(); paused=false; });
}

/* ------------------------------------------------------------------ تحكم */
function key(e,v){
  var k = e.key;
  if (k==='ArrowLeft'||k==='a'||k==='A') inp.left=v;
  else if (k==='ArrowRight'||k==='d'||k==='D') inp.right=v;
  else if (k===' '||k==='ArrowUp'||k==='w'||k==='W'){ if(v&&!inp.jump) p.buf=8; inp.jump=v; }
  else return;
  if (!paused) e.preventDefault();
}
window.addEventListener('keydown',function(e){ if(!paused) key(e,true); });
window.addEventListener('keyup',function(e){ key(e,false); });
function hold(id,fn){
  var el = document.getElementById(id);
  function on(e){ e.preventDefault(); el.classList.add('on'); fn(true); }
  function off(e){ el.classList.remove('on'); fn(false); }
  el.addEventListener('pointerdown',on);
  ['pointerup','pointercancel','pointerleave'].forEach(function(n){ el.addEventListener(n,off); });
}
hold('bL',function(v){inp.left=v;});
hold('bR',function(v){inp.right=v;});
hold('bJ',function(v){ if(v&&!inp.jump) p.buf=8; inp.jump=v; });
window.addEventListener('blur',function(){inp.left=inp.right=inp.jump=false;});

/* ------------------------------------------------------------------ فيزياء */
function land(y){ p.y=y-p.h; p.vy=0; p.on=true; }
function update(dt){
  var dir = (inp.right?1:0)-(inp.left?1:0);
  p.vx = dir*SPEED; if (dir) p.face = dir;
  p.x = Math.max(0,Math.min(worldW-p.w,p.x+p.vx*dt));
  p.vy = Math.min(p.vy+G*dt,15);
  var prevB = p.y+p.h; p.y += p.vy*dt; p.on = false;
  var b = p.y+p.h;
  if (p.vy>=0){
    if (b>=GROUND) land(GROUND);
    else for (var i=0;i<plats.length;i++){
      var pl=plats[i];
      if (p.x+p.w-6>pl.x && p.x+6<pl.x+pl.w && prevB<=pl.y+1 && b>=pl.y){ land(pl.y); break; }
    }
  }
  p.coy = p.on ? 8 : p.coy-dt;
  if (p.buf>0) p.buf-=dt;
  if (p.buf>0 && p.coy>0){ p.vy=-JUMP; p.buf=0; p.coy=0; p.on=false; }
  if (p.on) p.anim += Math.abs(p.vx)*dt*0.07;
  cam = Math.max(0,Math.min(worldW-W,p.x-330));
  var cx=p.x+p.w/2, cy=p.y+p.h/2;
  for (var s=0;s<stars.length;s++){
    var st=stars[s]; if (st.done) continue;
    var dx=st.x-cx, dy=st.y-cy;
    if (dx*dx+dy*dy<34*34){ openQ(s); inp.left=inp.right=inp.jump=false; break; }
  }
  for (var q=parts.length-1;q>=0;q--){
    var pt=parts[q]; pt.x+=pt.vx*dt; pt.y+=pt.vy*dt; pt.vy+=0.15*dt; pt.life-=dt;
    if (pt.life<=0) parts.splice(q,1);
  }
}
function burst(x,y){
  for (var i=0;i<18;i++){
    var a=Math.random()*6.28, v=1.5+Math.random()*3;
    parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1.5,life:30+Math.random()*20});
  }
}

/* ------------------------------------------------------------------ رسم */
function m(a,b){ return ((a%b)+b)%b; }
function rr(x,y,w,h,r){ ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x,y,w,h,r); else ctx.rect(x,y,w,h); }
function starPath(cx,cy,ro,ri){
  ctx.beginPath();
  for (var i=0;i<10;i++){ var a=-Math.PI/2+i*Math.PI/5, r=i%2?ri:ro; ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r); }
  ctx.closePath();
}
function stripes(x,y,w,h,r){
  ctx.save(); rr(x,y,w,h,r); ctx.clip(); ctx.fillStyle='#fff'; ctx.fillRect(x,y,w,h);
  ctx.fillStyle=C.blue; for (var yy=y; yy<y+h; yy+=5) ctx.fillRect(x,yy,w,2.5);
  ctx.restore();
}
function drawGirl(){
  var air=!p.on, sw=air?0:Math.sin(p.anim*2)*4, bob=air?0:-Math.abs(Math.sin(p.anim*2))*1.4, look=p.face*0+1.2;
  ctx.save(); ctx.translate(p.x-cam+p.w/2,p.y+p.h+bob); ctx.scale(p.face*1.12,1.12);
  // الشعر (خلف الرأس)
  ctx.fillStyle=C.hair; rr(-14,-60,28,26,12); ctx.fill();
  // الساقان والحذاء
  ctx.fillStyle=C.skin; rr(-7+sw*0.5,-13,5,11,2.5); ctx.fill(); rr(2-sw*0.5,-13,5,11,2.5); ctx.fill();
  ctx.fillStyle=C.shoe; rr(-10+sw*0.5,-4,10,5,2.5); ctx.fill(); rr(0-sw*0.5,-4,10,5,2.5); ctx.fill();
  // الذراع الخلفية
  ctx.save(); ctx.translate(-9,-38); ctx.rotate(-sw*0.06+(air?-0.45:0)); stripes(-3,0,6,15,3); ctx.fillStyle=C.skin; ctx.beginPath(); ctx.arc(0,16,3,0,6.3); ctx.fill(); ctx.restore();
  // القميص المخطط
  stripes(-9,-41,18,21,5);
  // النفنوف الأزرق الفاتح: صدرية وتنورة
  ctx.fillStyle=C.dress; rr(-7,-37,14,14,3); ctx.fill();
  rr(-7.5,-41,3,7,1.5); ctx.fill(); rr(4.5,-41,3,7,1.5); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-8,-25); ctx.lineTo(8,-25); ctx.lineTo(14,-9); ctx.quadraticCurveTo(0,-5,-14,-9); ctx.closePath(); ctx.fill();
  ctx.fillStyle=C.dressHem; ctx.beginPath(); ctx.moveTo(-13.3,-11.5); ctx.lineTo(13.3,-11.5); ctx.lineTo(14,-9); ctx.quadraticCurveTo(0,-5,-14,-9); ctx.closePath(); ctx.fill();
  // الذراع الأمامية
  ctx.save(); ctx.translate(9,-38); ctx.rotate(sw*0.06+(air?0.45:0)); stripes(-3,0,6,15,3); ctx.fillStyle=C.skin; ctx.beginPath(); ctx.arc(0,16,3,0,6.3); ctx.fill(); ctx.restore();
  // الرقبة والرأس
  ctx.fillStyle=C.skin; ctx.fillRect(-3,-45,6,6);
  ctx.beginPath(); ctx.arc(0,-51,11.5,0,6.3); ctx.fill();
  // غرة الشعر
  ctx.fillStyle=C.hair; ctx.beginPath(); ctx.moveTo(-12.5,-50); ctx.arc(0,-51,12.5,Math.PI,Math.PI*2); ctx.lineTo(12.5,-50);
  ctx.quadraticCurveTo(6,-57,-1,-55); ctx.quadraticCurveTo(-8,-54,-12.5,-50); ctx.closePath(); ctx.fill();
  // فيونكة صغيرة
  ctx.fillStyle=C.dress; ctx.beginPath(); ctx.arc(8,-61,3.2,0,6.3); ctx.fill(); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(8,-61,1.1,0,6.3); ctx.fill();
  // الوجه
  ctx.fillStyle='#3b2a22'; ctx.beginPath(); ctx.arc(-4+look,-50,1.7,0,6.3); ctx.arc(4+look,-50,1.7,0,6.3); ctx.fill();
  ctx.fillStyle='rgba(235,130,120,.4)'; ctx.beginPath(); ctx.arc(-7+look,-46,2.4,0,6.3); ctx.arc(7+look,-46,2.4,0,6.3); ctx.fill();
  ctx.strokeStyle='#8a4a3a'; ctx.lineWidth=1.2; ctx.lineCap='round'; ctx.beginPath(); ctx.arc(look,-47,3,0.2*Math.PI,0.8*Math.PI); ctx.stroke();
  ctx.restore();
}
function drawBg(t){
  var g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,C.sky1); g.addColorStop(1,C.sky2);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle=C.sun; ctx.beginPath(); ctx.arc(820,90,48,0,6.3); ctx.fill();
  // سحب
  ctx.fillStyle=C.cloud;
  for (var i=0;i<7;i++){
    var x=m(i*420-cam*0.12+t*5,W+520)-260, y=50+(i%3)*42;
    [[0,0,52,16],[34,-9,34,15],[-30,-6,28,12]].forEach(function(e){ ctx.beginPath(); ctx.ellipse(x+e[0],y+e[1],e[2],e[3],0,0,6.3); ctx.fill(); });
  }
  // تلال بعيدة وقريبة
  [[C.hill1,0.25,330,24,150],[C.hill2,0.45,365,20,110]].forEach(function(L){
    ctx.fillStyle=L[0]; ctx.beginPath(); ctx.moveTo(0,H);
    for (var x=0;x<=W;x+=16){ var u=x+cam*L[1]; ctx.lineTo(x,L[2]+Math.sin(u/L[4])*L[3]+Math.sin(u/(L[4]*0.43))*8); }
    ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
  });
  // وسوم HTML في الخلفية
  ctx.fillStyle=C.tag; ctx.font='500 30px '+getComputedStyle(document.body).getPropertyValue('--f-code'); ctx.textAlign='left';
  var step=300, loop=step*TAGS.length;
  for (var k=0;k<TAGS.length;k++){
    var tx=m(k*step-cam*0.55,loop)-120; if (tx<W+20) ctx.fillText(TAGS[k],tx,170+(k%3)*58);
  }
  // شجيرات
  for (var b=0;b<Math.ceil(worldW/330);b++){
    var bx=b*330+140-cam; if (bx<-80||bx>W+80) continue;
    ctx.fillStyle=C.bushDark; ctx.beginPath(); ctx.ellipse(bx,GROUND-4,44,26,0,Math.PI,0); ctx.fill();
    ctx.fillStyle=C.bush; ctx.beginPath(); ctx.ellipse(bx+20,GROUND-4,34,20,0,Math.PI,0); ctx.fill(); ctx.beginPath(); ctx.ellipse(bx-22,GROUND-4,28,16,0,Math.PI,0); ctx.fill();
  }
}
function drawWorld(t){
  // أرض
  ctx.fillStyle=C.ground; ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.fillStyle=C.groundTop; ctx.fillRect(0,GROUND,W,9);
  ctx.fillStyle=C.seam; for (var x=-m(cam,80);x<W;x+=80) ctx.fillRect(x,GROUND+9,2,H-GROUND);
  // منصات
  plats.forEach(function(pl){
    var x=pl.x-cam; if (x>W||x+pl.w<0) return;
    ctx.fillStyle=C.platSide; rr(x,pl.y+4,pl.w,16,7); ctx.fill();
    ctx.fillStyle=C.plat; rr(x,pl.y,pl.w,14,7); ctx.fill();
    ctx.fillStyle=C.platTop; rr(x+2,pl.y,pl.w-4,6,3); ctx.fill();
  });
  // نجوم
  stars.forEach(function(s){
    if (s.done) return; var x=s.x-cam; if (x<-40||x>W+40) return;
    var y=s.y+Math.sin(t*3+s.i)*4;
    ctx.save(); ctx.shadowColor='rgba(246,199,68,.9)'; ctx.shadowBlur=18;
    starPath(x,y,19,8.5); ctx.fillStyle='#f6c744'; ctx.fill(); ctx.restore();
    starPath(x,y,19,8.5); ctx.lineWidth=2; ctx.strokeStyle='#d9a521'; ctx.lineJoin='round'; ctx.stroke();
    starPath(x,y,9,4); ctx.fillStyle='#fff3bf'; ctx.fill();
  });
  // ظل اللاعبة
  var sy=GROUND, sw=18;
  for (var i=0;i<plats.length;i++){ var pl=plats[i]; if (p.x+p.w-6>pl.x && p.x+6<pl.x+pl.w && p.y+p.h<=pl.y+2) sy=Math.min(sy,pl.y); }
  ctx.fillStyle='rgba(20,60,75,.22)'; ctx.beginPath(); ctx.ellipse(p.x-cam+p.w/2,sy+2,22,5,0,0,6.3); ctx.fill();
  drawGirl();
  parts.forEach(function(pt){
    ctx.globalAlpha=Math.max(0,pt.life/40); starPath(pt.x-cam,pt.y,5,2.2); ctx.fillStyle='#f6c744'; ctx.fill();
  });
  ctx.globalAlpha=1;
}
function render(t){
  ctx.setTransform(sc,0,0,sc,0,0);
  drawBg(t); drawWorld(t);
}

/* ------------------------------------------------------------------ تشغيل */
var last = performance.now();
function frame(now){
  var dt = Math.min((now-last)/16.667,2.5); last = now;
  if (!paused) update(dt);
  render(now/1000);
  requestAnimationFrame(frame);
}
reset(); resize();
requestAnimationFrame(frame);
})();
</script>

</body>
</html>
